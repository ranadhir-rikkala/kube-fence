apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-fence
  namespace: kube-fence
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-fence
  namespace: kube-fence
  labels:
    app.kubernetes.io/name: kube-fence
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-fence
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-fence
    spec:
      serviceAccountName: kube-fence
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-fence
          image: kube-fence:dev
          imagePullPolicy: IfNotPresent
          args:
            - -config=/etc/kube-fence/config.yaml
            - -tls-cert=/etc/kube-fence/tls/tls.crt
            - -tls-key=/etc/kube-fence/tls/tls.key
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/kube-fence
              readOnly: true
            - name: tls
              mountPath: /etc/kube-fence/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kube-fence-config
        - name: tls
          secret:
            secretName: kube-fence-tls
---
apiVersion: v1
kind: Service
metadata:
  name: kube-fence
  namespace: kube-fence
spec:
  selector:
    app.kubernetes.io/name: kube-fence
  ports:
    - name: https
      port: 443
      targetPort: https
